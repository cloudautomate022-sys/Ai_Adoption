# Render Blueprint — one-click deployment of the decoupled stack.
#
# The frontend receives the backend hostname through API_URL at runtime, so the
# API can live on a different domain (Render, Fly.io, Railway, a VPS...) without
# rebuilding the Next.js app. Custom domains: update API_URL, FRONTEND_URL and
# CORS_ORIGINS in the Render dashboard.

services:
  - type: web
    name: ia-day-0-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: ia-day-0-web
          property: host
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: ia-day-0-web
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: ia-day-0-db
          property: connectionString

  - type: web
    name: ia-day-0-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -H 0.0.0.0 -p $PORT
    envVars:
      # Read by app/layout.tsx at runtime. It can be any backend URL.
      - key: API_URL
        fromService:
          type: web
          name: ia-day-0-api
          property: host
      # Build-time fallback for the same backend.
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: ia-day-0-api
          property: host

databases:
  - name: ia-day-0-db
    databaseName: ia_day0
    user: ia_day0
